repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: no-commit-to-branch
            args: [--branch, main]
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.9.29
      hooks:
          - id: uv-lock
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.0
      hooks:
          - id: ruff-check
          - id: ruff-format
