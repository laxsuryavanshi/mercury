# Directories excluded from linting and formatting (build artifacts, caches, venvs).
extend-exclude = [
    ".venv",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
]

# Match the community-standard 88-char line length (Black-compatible).
line-length = 88
indent-width = 4

# Target the minimum supported Python version (see .python-version / pyproject.toml).
target-version = "py314"

[lint]
# Curated, strict-but-pragmatic rule set. See https://docs.astral.sh/ruff/rules/
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import ordering)
    "B",     # flake8-bugbear (likely bugs & design problems)
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade (modern syntax)
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "PL",    # Pylint (subset)
    "RUF",   # Ruff-specific rules
    "N",     # pep8-naming
    "ASYNC", # flake8-async (correct async usage — critical for FastAPI)
    "S",     # flake8-bandit (security)
    "D",     # pydocstyle (docstrings)
    "ANN",   # flake8-annotations (require type hints)
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (multi-line summary on first line)
    "ANN401", # allow explicit `Any` where genuinely needed
]

# Autofix everything fixable; never auto-remove bugbear findings (they need review).
fixable = ["ALL"]
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Tests may use asserts, magic values, and skip docstrings/annotations.
"tests/**/*.py" = ["S101", "D", "ANN", "PLR2004"]
"**/test_*.py" = ["S101", "D", "ANN", "PLR2004"]
# The package __init__ needs no module docstring rules enforced aggressively.
"**/__init__.py" = ["D104"]

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
# Forbid relative imports to keep import paths unambiguous for humans and tools.
ban-relative-imports = "parents"

[format]
# Black-compatible formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
